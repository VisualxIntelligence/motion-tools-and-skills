<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PixelPilot lower third</title>
<!-- One family per <link>, with the weights you draw in. Nothing else is loaded. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=block">
<style>
  html, body { margin: 0; height: 100%; }
  /* The page is transparent too, so it also works as an OBS Browser Source (see the SKILL's delivery notes). */
  body { background: transparent; display: grid; place-items: center; font: 13px system-ui, sans-serif; color: #444; }
  canvas { width: min(96vw, 170vh); height: auto; display: block; }
  /* Preview grounds, behind the canvas only: never drawn into it, so they never reach the file. */
  body.checker canvas { background: repeating-conic-gradient(#d6d6d6 0 25%, #fff 0 50%) 0 0 / 32px 32px; }
  body.dark canvas { background: linear-gradient(135deg, #1d2430, #3a3f38 55%, #0c0d10); }
  body.light canvas { background: linear-gradient(135deg, #f4efe6, #bfcad3 50%, #fbfbfb); }
  #bar { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); background: #fffc; padding: 4px 10px; border-radius: 6px; }
</style>
</head>
<body class="checker">
<canvas></canvas>
<div id="bar">space: play/pause · B: background · ←/→: step · 1-9: card</div>
<script>
// ─── What it says ────────────────────────────────────────────────────────────
// One entry per card: a person, a scripture reference, a song, a topic. The same design renders one file
// per entry (render.mjs --card N). Replace these placeholders with the user's words, exactly as given.
const CARDS = [
  { title: 'PixelPilot', sub: 'Speedrunning Hollow Knight' },
];

// ─── Frame and timing ────────────────────────────────────────────────────────
const W = 1920, H = 1080, FPS = 30;          // design size; ?scale=2 renders 3840x2160 from the same drawing
const IN = 0.8, HOLD = 6, OUT = 0.5;         // seconds: build in, stay still and readable, clear
const LEAD = 0.2, TAIL = 0.3;                // empty frames at both ends, so the clip never pops on or cuts off
const DUR = LEAD + IN + HOLD + OUT + TAIL;
const SAFE = 0.06;                           // keep everything this far in from every edge (title-safe is 5%)

// ─── Look ────────────────────────────────────────────────────────────────────
const LOOK = {
  display: 'Orbitron', body: 'Chakra Petch',
  panel: 'rgba(8,6,20,0.92)', text: '#ffffff', neon: '#19f0ff', hot: '#ff2bd6', tabText: '#14021a',
};
// Every face you draw with: weight (and 'italic' when used) + family. Each is loaded before the first frame;
// a face missing here can silently render in a fallback font. Keep in step with the <link> above.
const FONTS = ['900 Orbitron', '700 Chakra Petch'];

// ─── Machinery (keep) ────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const SCALE = Number(params.get('scale')) || 1;
let card = Number(params.get('card')) || 0;
const canvas = document.querySelector('canvas');
canvas.width = W * SCALE; canvas.height = H * SCALE;
const ctx = canvas.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = {
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  in: t => t * t * t,
  back: t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
// progress of a move that starts at `start` seconds and lasts `len`, eased
const move = (t, start, len, fn = ease.out) => fn(clamp((t - start) / len));
// the largest font size (≤ max) at which `text` fits in `width`
function fit(text, weight, family, max, width) {
  let s = max; ctx.font = `${weight} ${s}px "${family}"`;
  while (s > 8 && ctx.measureText(text).width > width) { s -= 1; ctx.font = `${weight} ${s}px "${family}"`; }
  return s;
}
const tIn = LEAD, tOut = LEAD + IN + HOLD;   // when the build-in starts, when the build-out starts

// ─── The graphic: rewrite this for the brief ─────────────────────────────────
function drawGraphic(t, c) {
  const x = W * SAFE + 12, bottom = H * (1 - SAFE) - 24;
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  const nameSize = fit(c.title, 900, LOOK.display, 72, 900);
  ctx.font = `900 ${nameSize}px "${LOOK.display}"`;
  const nameW = ctx.measureText(c.title).width;
  const subSize = Math.round(nameSize * 0.46), sub = c.sub.toUpperCase(), track = subSize * 0.14;
  ctx.font = `700 ${subSize}px "${LOOK.body}"`;
  const subW = ctx.measureText(sub).width + sub.length * track;
  const padX = 40, panelH = Math.round(nameSize * 1.6), slant = Math.round(panelH * 0.32);
  const panelW = nameW + padX * 2 + slant, tabH = Math.round(subSize * 1.9), tabSlant = Math.round(tabH * 0.32);
  const tabW = subW + 44 + tabSlant, panelY = bottom - tabH - panelH, tabX = x + slant * 0.5 + 18;
  // parallelogram leaning right: top edge shifted by `sl`
  const para = (px, py, pw, ph, sl) => { ctx.beginPath(); ctx.moveTo(px + sl, py); ctx.lineTo(px + pw, py); ctx.lineTo(px + pw - sl, py + ph); ctx.lineTo(px, py + ph); ctx.closePath(); };
  const perim = 2 * (panelW - slant) + 2 * Math.hypot(slant, panelH);
  // neon flicker: a fixed per-frame pattern while the tube strikes, then steady
  const fl = [1, .15, 1, 1, .3, .9, 1], fi = Math.floor((t - tIn - .3) * FPS);
  const flick = fi >= 0 && fi < fl.length ? fl[fi] : 1;

  // in: outline traces, panel fills, name slams in with an RGB split, tab drops out; out: CRT switch-off
  const trace = move(t, tIn, .35, ease.inOut);
  const fill = move(t, tIn + .15, .35, ease.inOut);
  const slam = move(t, tIn + .3, .35, ease.back);
  const split = 1 - move(t, tIn + .3, .45);
  const tab = move(t, tIn + .5, .3);
  const squash = 1 - move(t, tOut + .05, .22, ease.in);
  const line = 1 - move(t, tOut + .27, .2, ease.inOut);
  if (t < tIn || line <= 0) return;

  const cy = panelY + (panelH + tabH) / 2;
  ctx.save();
  if (squash < 1) { ctx.translate(0, cy); ctx.scale(1, Math.max(squash, .001)); ctx.translate(0, -cy); }
  if (squash > .02) {
    // tab first, so it slides out from under the panel
    if (tab > 0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(tabX - 20, panelY + panelH, tabW + 40, tabH + 20); ctx.clip();
      const ty = panelY + panelH - tabH * (1 - tab);
      ctx.shadowColor = LOOK.hot; ctx.shadowBlur = 18;
      ctx.fillStyle = LOOK.hot; para(tabX, ty, tabW, tabH, tabSlant); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = LOOK.tabText; ctx.font = `700 ${subSize}px "${LOOK.body}"`; ctx.textBaseline = 'middle';
      if ('letterSpacing' in ctx) ctx.letterSpacing = `${track}px`;
      ctx.fillText(sub, tabX + tabSlant * 0.5 + 22, ty + tabH / 2 + 1);
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.restore();
    }
    // panel fill, wiped from the left
    if (fill > 0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(x - 4, panelY - 4, (panelW + 8) * fill, panelH + 8); ctx.clip();
      ctx.fillStyle = LOOK.panel; para(x, panelY, panelW, panelH, slant); ctx.fill();
      ctx.restore();
    }
    // neon outline, traced around the panel
    ctx.save();
    ctx.globalAlpha = flick;
    ctx.strokeStyle = LOOK.neon; ctx.lineWidth = 3; ctx.lineJoin = 'miter';
    ctx.setLineDash([perim * trace, perim]);
    ctx.shadowColor = LOOK.neon; ctx.shadowBlur = 22;
    para(x, panelY, panelW, panelH, slant); ctx.stroke(); ctx.stroke();
    ctx.restore();
    // the name: slams in from the right, cyan/magenta ghosts converge on it
    if (slam > 0) {
      ctx.save();
      para(x, panelY, panelW, panelH, slant); ctx.clip();
      ctx.beginPath(); ctx.rect(x - 4, panelY - 4, (panelW + 8) * fill, panelH + 8); ctx.clip();   // only over the filled panel
      ctx.font = `900 ${nameSize}px "${LOOK.display}"`; ctx.textBaseline = 'middle';
      const nx = x + slant * 0.5 + padX + (1 - slam) * 160, ny = panelY + panelH / 2 + nameSize * 0.04;
      if (split > 0.01) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = split;
        ctx.fillStyle = LOOK.hot; ctx.fillText(c.title, nx - split * 26, ny);
        ctx.fillStyle = LOOK.neon; ctx.fillText(c.title, nx + split * 26, ny);
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      }
      ctx.globalAlpha = clamp(slam * 1.5);
      ctx.shadowColor = LOOK.neon; ctx.shadowBlur = 16;
      ctx.fillStyle = LOOK.text; ctx.fillText(c.title, nx, ny);
      ctx.restore();
    }
  }
  ctx.restore();
  // the switch-off: a bright line that shrinks to its centre
  if (squash <= .02 && line > 0) {
    const lw = (panelW + 20) * line, lx = x + (panelW - lw) / 2;
    ctx.save(); ctx.shadowColor = LOOK.neon; ctx.shadowBlur = 20; ctx.fillStyle = '#e8fdff';
    ctx.fillRect(lx, cy - 2, lw, 4); ctx.restore();
  }
}

// ─── Frame (keep) ────────────────────────────────────────────────────────────
function draw(frame) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.clearRect(0, 0, W, H);                   // transparent: never fill the ground
  drawGraphic(frame / FPS, CARDS[Math.min(card, CARDS.length - 1)]);
}
window.draw = draw; window.FPS = FPS; window.FRAMES = Math.round(DUR * FPS);
window.PHASES = { in: [tIn, tIn + IN], out: [tOut, tOut + OUT] };   // render.mjs --sheet --in / --out
window.ready = Promise.all(FONTS.map(f => { const [, style, weight, family] = f.match(/^(italic )?(\d+) (.+)$/); return document.fonts.load(`${style || ''}${weight} 40px "${family}"`); }))
  .then(faces => { faces.forEach((l, i) => l.length || console.warn('font not loaded: ' + FONTS[i])); return document.fonts.ready; });

// ─── Preview (skipped when rendering) ────────────────────────────────────────
if (!params.has('render')) {
  const grounds = ['checker', 'dark', 'light', 'none'];
  let f = 0, playing = true, g = 0;
  if (params.has('obs')) { document.body.className = ''; document.getElementById('bar').remove(); }
  addEventListener('keydown', e => {
    if (e.key === ' ') playing = !playing;
    else if (e.key === 'b' || e.key === 'B') document.body.className = grounds[g = (g + 1) % grounds.length];
    else if (e.key === 'ArrowRight') { playing = false; f = Math.min(window.FRAMES - 1, f + 1); }
    else if (e.key === 'ArrowLeft') { playing = false; f = Math.max(0, f - 1); }
    else if (/^[1-9]$/.test(e.key) && Number(e.key) <= CARDS.length) { card = Number(e.key) - 1; f = 0; }
  });
  window.ready.then(() => {
    let last = performance.now();
    (function tick(now) {
      if (playing && now - last >= 1000 / FPS) {
        last = now; f += 1;
        if (f >= window.FRAMES) { if (params.has('obs') && !params.has('loop')) { playing = false; f = window.FRAMES - 1; } else f = 0; }
      }
      draw(f); requestAnimationFrame(tick);
    })(last);
  });
}
</script>
</body>
</html>
