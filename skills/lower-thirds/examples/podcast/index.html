<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Off the Record lower thirds</title>
<!-- One family per <link>, with the weights you draw in. Nothing else is loaded. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=block">
<style>
  html, body { margin: 0; height: 100%; }
  /* The page is transparent too, so it also works as an OBS Browser Source (see the SKILL's delivery notes). */
  body { background: transparent; display: grid; place-items: center; font: 13px system-ui, sans-serif; color: #444; }
  canvas { width: min(96vw, 170vh); height: auto; display: block; }
  /* Preview grounds, behind the canvas only: never drawn into it, so they never reach the file. */
  body.checker canvas { background: repeating-conic-gradient(#d6d6d6 0 25%, #fff 0 50%) 0 0 / 32px 32px; }
  body.dark canvas { background: linear-gradient(135deg, #1d2430, #3a3f38 55%, #0c0d10); }
  body.light canvas { background: linear-gradient(135deg, #f4efe6, #bfcad3 50%, #fbfbfb); }
  #bar { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); background: #fffc; padding: 4px 10px; border-radius: 6px; }
</style>
</head>
<body class="checker">
<canvas></canvas>
<div id="bar">space: play/pause · B: background · ←/→: step · 1-9: card</div>
<script>
// ─── What it says ────────────────────────────────────────────────────────────
// One entry per card: a person, a scripture reference, a song, a topic. The same design renders one file
// per entry (render.mjs --card N). Replace these placeholders with the user's words, exactly as given.
const SHOW = 'OFF THE RECORD';                 // the kicker above every name
const CARDS = [
  { title: 'Maya Chen', sub: 'Host' },
  { title: 'Daniel Ortiz', sub: 'Founder, Northwind' },
];

// ─── Frame and timing ────────────────────────────────────────────────────────
const W = 1920, H = 1080, FPS = 30;          // design size; ?scale=2 renders 3840x2160 from the same drawing
const IN = 1.05, HOLD = 6, OUT = 0.6;         // seconds: build in, stay still and readable, clear
const LEAD = 0.2, TAIL = 0.3;                // empty frames at both ends, so the clip never pops on or cuts off
const DUR = LEAD + IN + HOLD + OUT + TAIL;
const SAFE = 0.06;                           // keep everything this far in from every edge (title-safe is 5%)

// ─── Look ────────────────────────────────────────────────────────────────────
const LOOK = {
  display: 'Newsreader', body: 'Inter',
  panel: 'rgba(246,242,234,0.97)', text: '#16140f', accent: '#c8372d', sub: '#5c564b',
};
// Every face you draw with: weight (and 'italic' when used) + family. Each is loaded before the first frame;
// a face missing here can silently render in a fallback font. Keep in step with the <link> above.
const FONTS = ['500 Newsreader', 'italic 400 Newsreader', '600 Inter'];

// ─── Machinery (keep) ────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const SCALE = Number(params.get('scale')) || 1;
let card = Number(params.get('card')) || 0;
const canvas = document.querySelector('canvas');
canvas.width = W * SCALE; canvas.height = H * SCALE;
const ctx = canvas.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = {
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  in: t => t * t * t,
  back: t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
// progress of a move that starts at `start` seconds and lasts `len`, eased
const move = (t, start, len, fn = ease.out) => fn(clamp((t - start) / len));
// the largest font size (≤ max) at which `text` fits in `width`
function fit(text, weight, family, max, width) {
  let s = max; ctx.font = `${weight} ${s}px "${family}"`;
  while (s > 8 && ctx.measureText(text).width > width) { s -= 1; ctx.font = `${weight} ${s}px "${family}"`; }
  return s;
}
const tIn = LEAD, tOut = LEAD + IN + HOLD;   // when the build-in starts, when the build-out starts

// ─── The graphic: rewrite this for the brief ─────────────────────────────────
function drawGraphic(t, c) {
  const x = W * SAFE, bottom = H * (1 - SAFE) - 24;
  const padX = 40, padT = 30, padB = 30, rule = 4;
  const kSize = 17, roleSize = 32;
  const nameSize = fit(c.title, 500, LOOK.display, 68, 1000);
  ctx.font = `500 ${nameSize}px "${LOOK.display}"`; const nameW = ctx.measureText(c.title).width;
  ctx.font = `italic 400 ${roleSize}px "${LOOK.display}"`; const roleW = ctx.measureText(c.sub).width;
  ctx.font = `600 ${kSize}px "${LOOK.body}"`; ctx.letterSpacing = `${kSize * 0.24}px`;
  const kW = ctx.measureText(SHOW).width + 34; ctx.letterSpacing = '0px';
  const panelW = Math.max(nameW, roleW, kW) + padX * 2;
  // vertical rhythm, top down from the panel edge (alphabetic baselines)
  const kBase = padT + kSize * 0.73, nameBase = kBase + 22 + nameSize * 0.74, roleBase = nameBase + 14 + roleSize * 0.78;
  const panelH = roleBase + roleSize * 0.25 + padB;
  const panelY = bottom - panelH;

  // in: the red rule draws across, the paper unfolds down from it, then kicker, name and role settle in
  // out: the words go first, the paper folds back up into the rule, the rule runs off to the right
  const ruleIn = move(t, tIn, .45, ease.inOut), ruleOut = move(t, tOut + .3, .3, ease.inOut);
  const unfold = move(t, tIn + .32, .45, ease.inOut) * (1 - move(t, tOut + .12, .3, ease.inOut));
  const kick = move(t, tIn + .35, .45) * (1 - move(t, tOut, .2, ease.in));
  const name = move(t, tIn + .42, .5) * (1 - move(t, tOut, .22, ease.in));
  const role = move(t, tIn + .55, .5) * (1 - move(t, tOut + .03, .22, ease.in));
  if (ruleIn <= 0 || ruleOut >= 1) return;

  const ph = panelH * unfold;
  if (ph > 0.5) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 28; ctx.shadowOffsetY = 8;
    ctx.fillStyle = LOOK.panel; ctx.fillRect(x, panelY, panelW, ph);
    ctx.restore();
  }
  // the rule sits on the panel's top edge
  const rx0 = x + panelW * ruleOut, rx1 = x + panelW * ruleIn;
  ctx.fillStyle = LOOK.accent; ctx.fillRect(rx0, panelY - rule, rx1 - rx0, rule);

  ctx.save();                                   // words live inside the unfolded paper only
  ctx.beginPath(); ctx.rect(x, panelY, panelW, ph); ctx.clip();
  ctx.textBaseline = 'alphabetic';
  if (kick > 0) {
    ctx.globalAlpha = kick;
    const kx = x + padX - (1 - kick) * 10;
    ctx.fillStyle = LOOK.accent; ctx.fillRect(kx, panelY + kBase - kSize * 0.36 - 1, 22, 3);
    ctx.font = `600 ${kSize}px "${LOOK.body}"`; ctx.letterSpacing = `${kSize * 0.24}px`;
    ctx.fillText(SHOW, kx + 34, panelY + kBase); ctx.letterSpacing = '0px';
  }
  if (name > 0) {
    ctx.globalAlpha = name; ctx.fillStyle = LOOK.text; ctx.font = `500 ${nameSize}px "${LOOK.display}"`;
    ctx.fillText(c.title, x + padX, panelY + nameBase + (1 - name) * 16);
  }
  if (role > 0) {
    ctx.globalAlpha = role; ctx.fillStyle = LOOK.sub; ctx.font = `italic 400 ${roleSize}px "${LOOK.display}"`;
    ctx.fillText(c.sub, x + padX, panelY + roleBase + (1 - role) * 12);
  }
  ctx.restore();
}

// ─── Frame (keep) ────────────────────────────────────────────────────────────
function draw(frame) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.clearRect(0, 0, W, H);                   // transparent: never fill the ground
  drawGraphic(frame / FPS, CARDS[Math.min(card, CARDS.length - 1)]);
}
window.draw = draw; window.FPS = FPS; window.FRAMES = Math.round(DUR * FPS);
window.PHASES = { in: [tIn, tIn + IN], out: [tOut, tOut + OUT] };   // render.mjs --sheet --in / --out
window.ready = Promise.all(FONTS.map(f => { const [, style, weight, family] = f.match(/^(italic )?(\d+) (.+)$/); return document.fonts.load(`${style || ''}${weight} 40px "${family}"`); }))
  .then(faces => { faces.forEach((l, i) => l.length || console.warn('font not loaded: ' + FONTS[i])); return document.fonts.ready; });

// ─── Preview (skipped when rendering) ────────────────────────────────────────
if (!params.has('render')) {
  const grounds = ['checker', 'dark', 'light', 'none'];
  let f = 0, playing = true, g = 0;
  if (params.has('obs')) { document.body.className = ''; document.getElementById('bar').remove(); }
  addEventListener('keydown', e => {
    if (e.key === ' ') playing = !playing;
    else if (e.key === 'b' || e.key === 'B') document.body.className = grounds[g = (g + 1) % grounds.length];
    else if (e.key === 'ArrowRight') { playing = false; f = Math.min(window.FRAMES - 1, f + 1); }
    else if (e.key === 'ArrowLeft') { playing = false; f = Math.max(0, f - 1); }
    else if (/^[1-9]$/.test(e.key) && Number(e.key) <= CARDS.length) { card = Number(e.key) - 1; f = 0; }
  });
  window.ready.then(() => {
    let last = performance.now();
    (function tick(now) {
      if (playing && now - last >= 1000 / FPS) {
        last = now; f += 1;
        if (f >= window.FRAMES) { if (params.has('obs') && !params.has('loop')) { playing = false; f = window.FRAMES - 1; } else f = 0; }
      }
      draw(f); requestAnimationFrame(tick);
    })(last);
  });
}
</script>
</body>
</html>
