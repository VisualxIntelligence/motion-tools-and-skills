<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lower third</title>
<!-- One family per <link>, with the weights you draw in. Nothing else is loaded. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=block">
<style>
  html, body { margin: 0; height: 100%; }
  /* The page is transparent too, so it also works as an OBS Browser Source (see the SKILL's delivery notes). */
  body { background: transparent; display: grid; place-items: center; font: 13px system-ui, sans-serif; color: #444; }
  canvas { width: min(96vw, 170vh); height: auto; display: block; }
  /* Preview grounds, behind the canvas only: never drawn into it, so they never reach the file. */
  body.checker canvas { background: repeating-conic-gradient(#d6d6d6 0 25%, #fff 0 50%) 0 0 / 32px 32px; }
  body.dark canvas { background: linear-gradient(135deg, #1d2430, #3a3f38 55%, #0c0d10); }
  body.light canvas { background: linear-gradient(135deg, #f4efe6, #bfcad3 50%, #fbfbfb); }
  #bar { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); background: #fffc; padding: 4px 10px; border-radius: 6px; }
</style>
</head>
<body class="checker">
<canvas></canvas>
<div id="bar">space: play/pause · B: background · ←/→: step · 1-9: card (= --card 0-8)</div>
<script>
// ─── What it says ────────────────────────────────────────────────────────────
// One entry per card: a person, a scripture reference, a song, a topic. The same design renders one file
// per entry (render.mjs --card N). Replace these placeholders with the user's words, exactly as given.
const CARDS = [
  { title: 'First Last', sub: 'Role or context' },
  { title: 'Second Person', sub: 'Their role' },
];

// ─── Frame and timing ────────────────────────────────────────────────────────
const W = 1920, H = 1080, FPS = 30;          // design size; ?scale=2 renders 3840x2160 from the same drawing
const IN = 0.8, HOLD = 6, OUT = 0.6;         // seconds: build in, stay still and readable, clear
const LEAD = 0.2, TAIL = 0.3;                // empty frames at both ends, so the clip never pops on or cuts off
const DUR = LEAD + IN + HOLD + OUT + TAIL;
const SAFE = 0.06;                           // keep everything this far in from every edge (title-safe is 5%)

// ─── Look ────────────────────────────────────────────────────────────────────
const LOOK = {
  display: 'Inter', body: 'Inter',
  panel: 'rgba(14,16,20,0.9)', text: '#ffffff', accent: '#ff5a36', sub: '#ffffff',
};
// Every face you draw with: weight (and 'italic' when used) + family. Each is loaded before the first frame;
// a face missing here can silently render in a fallback font. Keep in step with the <link> above.
const FONTS = ['700 Inter', '500 Inter'];

// ─── Machinery (keep) ────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const SCALE = Number(params.get('scale')) || 1;
let card = Number(params.get('card')) || 0;
const canvas = document.querySelector('canvas');
canvas.width = W * SCALE; canvas.height = H * SCALE;
const ctx = canvas.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = {
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  in: t => t * t * t,
  back: t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
// progress of a move that starts at `start` seconds and lasts `len`, eased
const move = (t, start, len, fn = ease.out) => fn(clamp((t - start) / len));
// the largest font size (≤ max) at which `text` fits in `width`
function fit(text, weight, family, max, width) {
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';   // letterSpacing persists until reset: measure without it
  let s = max; ctx.font = `${weight} ${s}px "${family}"`;
  while (s > 8 && ctx.measureText(text).width > width) { s -= 1; ctx.font = `${weight} ${s}px "${family}"`; }
  return s;
}
const tIn = LEAD, tOut = LEAD + IN + HOLD;   // the build-in runs tIn → tIn+IN, the build-out tOut → tOut+OUT

// ─── The graphic: rewrite this for the brief ─────────────────────────────────
function drawGraphic(t, c) {
  const x = W * SAFE, bottom = H * (1 - SAFE) - 40;
  const nameSize = fit(c.title, 700, LOOK.display, 64, 900);
  ctx.font = `700 ${nameSize}px "${LOOK.display}"`;
  const nameW = ctx.measureText(c.title).width;
  const roleSize = Math.round(nameSize * 0.42);
  ctx.font = `500 ${roleSize}px "${LOOK.body}"`;
  const role = c.sub.toUpperCase(), roleW = ctx.measureText(role).width + role.length * roleSize * 0.12;
  const padX = 34, barW = 10, panelH = nameSize * 1.55, tabH = roleSize * 2;
  const panelW = nameW + padX * 2, tabW = roleW + padX;
  const panelY = bottom - tabH - panelH;

  // every reveal (wipe, clip) must be as wide as what it reveals, or text is cut off mid-hold
  // in: the accent bar grows, the panel wipes open from it, the name rises, the role tab slides out; out: reverse
  const a = move(t, tIn, .35) * (1 - move(t, tOut + .35, .25, ease.in));
  const wipe = move(t, tIn + .2, .45, ease.inOut) * (1 - move(t, tOut + .15, .3, ease.inOut));
  const rise = move(t, tIn + .35, .4) * (1 - move(t, tOut, .2, ease.in));
  const tab = move(t, tIn + .5, .35) * (1 - move(t, tOut, .2, ease.in));
  if (a <= 0) return;

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
  ctx.fillStyle = LOOK.panel; ctx.fillRect(x + barW, panelY, panelW * wipe, panelH);
  ctx.restore();
  ctx.fillStyle = LOOK.accent; ctx.fillRect(x, panelY + panelH * (1 - a), barW, (panelH + tabH) * a);

  ctx.save();                                   // the name rises inside the panel, clipped to it
  ctx.beginPath(); ctx.rect(x + barW, panelY, panelW * wipe, panelH); ctx.clip();
  ctx.fillStyle = LOOK.text; ctx.font = `700 ${nameSize}px "${LOOK.display}"`; ctx.textBaseline = 'middle';
  ctx.fillText(c.title, x + barW + padX, panelY + panelH / 2 + (1 - rise) * panelH * .6);
  ctx.restore();

  if (tab > 0) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x + barW, panelY + panelH, tabW, tabH); ctx.clip();
    const ty = panelY + panelH - tabH * (1 - tab);
    ctx.fillStyle = LOOK.accent; ctx.fillRect(x + barW, ty, tabW, tabH);
    ctx.fillStyle = LOOK.sub; ctx.font = `500 ${roleSize}px "${LOOK.body}"`; ctx.textBaseline = 'middle';
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${roleSize * 0.12}px`;   // restored with ctx.restore() below
    ctx.fillText(role, x + barW + padX / 2, ty + tabH / 2);
    ctx.restore();
  }
}

// ─── Frame (keep) ────────────────────────────────────────────────────────────
function draw(frame) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.clearRect(0, 0, W, H);                   // transparent: never fill the ground
  drawGraphic(frame / FPS, CARDS[Math.min(card, CARDS.length - 1)]);
}
window.draw = draw; window.FPS = FPS; window.FRAMES = Math.round(DUR * FPS);
window.PHASES = { in: [tIn, tIn + IN], out: [tOut, tOut + OUT] };   // render.mjs --sheet --in / --out
// A face counts as loaded only if one with that exact weight and style came back: otherwise the browser
// draws the nearest weight (or a fallback family), which is not the design.
window.ready = Promise.all(FONTS.map(async f => {
  const [, italic, weight, family] = f.match(/^(italic )?(\d+) (.+)$/);
  const faces = await document.fonts.load(`${italic || ''}${weight} 40px "${family}"`);
  const covers = w => { const [lo, hi = lo] = String(w).split(' ').map(Number); return +weight >= lo && +weight <= hi; };
  if (!faces.some(x => covers(x.weight) && (x.style === 'italic') === !!italic)) console.warn('font not loaded: ' + f);
})).then(() => document.fonts.ready);

// ─── Preview (skipped when rendering) ────────────────────────────────────────
if (!params.has('render')) {
  const grounds = ['checker', 'dark', 'light', 'none'];
  let f = 0, playing = true, g = 0;
  if (params.has('obs')) { document.body.className = ''; document.getElementById('bar').remove(); }
  addEventListener('keydown', e => {
    if (e.key === ' ') playing = !playing;
    else if (e.key === 'b' || e.key === 'B') document.body.className = grounds[g = (g + 1) % grounds.length];
    else if (e.key === 'ArrowRight') { playing = false; f = Math.min(window.FRAMES - 1, f + 1); }
    else if (e.key === 'ArrowLeft') { playing = false; f = Math.max(0, f - 1); }
    else if (/^[1-9]$/.test(e.key) && Number(e.key) <= CARDS.length) { card = Number(e.key) - 1; f = 0; }
  });
  window.ready.then(() => {
    let last = performance.now();
    (function tick(now) {
      if (playing && now - last >= 1000 / FPS) {
        last = now; f += 1;
        if (f >= window.FRAMES) { if (params.has('obs') && !params.has('loop')) { playing = false; f = window.FRAMES - 1; } else f = 0; }
      }
      draw(f); requestAnimationFrame(tick);
    })(last);
  });
}
</script>
</body>
</html>
