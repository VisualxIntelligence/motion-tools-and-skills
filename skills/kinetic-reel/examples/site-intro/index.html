<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E0F0E" />
  <title>涂喆宸 Zhechen Tu — Work Reel ’26</title>
  <meta name="description" content="Zhechen Tu (涂喆宸) — AI application & agent engineer. An 84-second work reel, then the portfolio: Microsoft Cloud & AI, UW–Madison Department of Surgery, enterprise RAG." />
  <link rel="canonical" href="home.html" />
  <link rel="preload" href="fonts/anton-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/jetbrains-mono-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/intro-reel.css?v=2" />
  <noscript><meta http-equiv="refresh" content="0; url=home.html" /></noscript>
</head>
<body class="reel" data-mode="loading">
  <main class="reel__stage">
    <!-- The work reel (built in reel-src/kinetic). The source is picked by js/intro-reel.js (1600×900 or 960×540). -->
    <video class="reel__video" id="reel" playsinline preload="auto" poster="assets/reel/poster.jpg?v=1" aria-label="Zhechen Tu — Work Reel ’26"></video>
    <div class="reel__buffer" aria-hidden="true"></div>

    <!-- during playback: skip + sound, top centre (the reel's own HUD owns the corners) -->
    <div class="reel__bar">
      <button class="rbtn rbtn--skip" type="button" data-skip aria-label="Skip the intro and enter the site / 跳过片头，进入主页">
        <svg class="rbtn__ring" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" class="rbtn__track" /><circle cx="16" cy="16" r="13" class="rbtn__prog" data-ring /><path d="M13 11l6 5-6 5" class="rbtn__chev" /></svg>
        <span class="rbtn__label">Skip intro</span><span class="rbtn__zh">跳过</span>
      </button>
      <button class="rbtn rbtn--sound" type="button" data-sound aria-pressed="false" aria-label="Toggle sound / 声音开关">
        <span class="rbtn__eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="rbtn__label" data-sound-label>Sound off</span>
      </button>
    </div>
    <p class="reel__hint" aria-hidden="true"><span>Tap for sound</span><span class="reel__hint-zh">点击开启声音</span></p>
    <p class="reel__rotate" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2" /><path d="M11 18h2" /></svg><span>Turn your phone · 横屏观看更佳</span></p>

    <!-- after the reel (or instead of it): replay / enter -->
    <section class="reel__end" data-end hidden aria-labelledby="endName">
      <canvas class="reel__field" data-field aria-hidden="true"></canvas>
      <span class="reel__corner reel__corner--tl" aria-hidden="true"></span><span class="reel__corner reel__corner--tr" aria-hidden="true"></span>
      <span class="reel__corner reel__corner--bl" aria-hidden="true"></span><span class="reel__corner reel__corner--br" aria-hidden="true"></span>
      <div class="reel__meta reel__meta--top">
        <span data-end-kicker>Work Reel ’26 — end of trace</span>
        <span class="reel__status"><i></i><span data-end-status>Status OK</span></span>
      </div>

      <div class="reel__center">
        <h1 class="reel__name" id="endName" aria-label="Zhechen Tu"><span class="reel__line" data-letters>ZHECHEN</span><span class="reel__line" data-letters data-accent-last>TU.</span></h1>
        <p class="reel__role"><span>AI Application &amp; Agent Engineer</span><span class="reel__role-zh">涂喆宸</span></p>
        <div class="reel__actions">
          <a class="rcta rcta--primary" href="home.html" data-enter>
            <span class="rcta__roll"><span>Enter the site</span><span aria-hidden="true">Enter the site</span></span>
            <span class="rcta__zh">进入主页</span>
            <svg class="rcta__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18L18 6M8 6h10v10" /></svg>
          </a>
          <button class="rcta rcta--ghost" type="button" data-replay>
            <svg class="rcta__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
            <span class="rcta__roll"><span data-replay-label>Watch again</span><span aria-hidden="true" data-replay-label>Watch again</span></span>
            <span class="rcta__zh" data-replay-zh>再看一遍</span>
          </button>
        </div>
      </div>

      <div class="reel__meta reel__meta--bottom">
        <span>you@example.com</span>
        <span class="reel__trace" aria-hidden="true"><i></i><i class="is-lead"></i><i></i><i></i><i></i></span>
        <span>github.com/your-handle</span>
      </div>
    </section>
  </main>

  <!-- exit: a lime iris from the button that was pressed, then the portfolio -->
  <div class="reel__wipe" data-wipe aria-hidden="true"><span>Zhechen<b>.</b>Tu</span></div>
  <noscript><p class="reel__noscript"><a href="home.html">进入作品集 / Enter the portfolio →</a></p></noscript>
  <script src="js/intro-reel.js?v=2"></script>
</body>
</html>
